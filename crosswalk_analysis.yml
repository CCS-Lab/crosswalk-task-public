name: crosswalk_analysis
channels:
  - conda-forge
  - default
dependencies:
  - python=3.10
  - pygame=2.1.3
  - numpy=1.24.1
  - pandas=1.5
  - matplotlib=3.8.4
  - scipy=1.11
  - scikit-learn=1.6.1
  - pytorch=2.10.0
  - skorch=1.3.1
  - seaborn=0.13.2
  - yellowbrick=1.5
  - kneed=0.8.5
  - ipykernel
  - requests
  - charset-normalizer=2
  - jupyter # run `jupyter notebook xxx.ipynb`
  - pingouin=0.5.5 # ICC
  - glmnet # needed for easymlpy.glmnet
  - pip
  - pip:
      - crosswalk-env
      - factor_analyzer
      - easymlpy # LASSO
      - progressbar2 # needed for easymlpy
      - gymnasium==0.29.1
      - tensorboard==2.15.2 # run `tensorboard --logdir=./tb_logs/`
      - stable-baselines3==2.2.1 # DQN # requirements: gymnasium>=0.28.1,<0.30
      - imitation==1.0.1 # AIRL # requirements: gymnasium~=0.29, stable-baselines3~=2.2.1
      - ray==2.11.0
      - tensorflow==2.15.0
